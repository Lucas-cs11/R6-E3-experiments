name: E3-06 Sirio source build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned Sirio
        uses: actions/checkout@v4
        with:
          repository: oris-tool/sirio
          ref: 5bb689933b3db47b96d33d34e10230cca608003d
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - name: Build (Maven project rooted at sirio/)
        run: |
          set +e
          mvn -B -f sirio/pom.xml -DskipTests package 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "BUILD_EXIT=$rc" | tee build.exit
          test "$rc" -eq 0
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          cp build.log build.exit evidence/ 2>/dev/null || true
          git rev-parse HEAD > evidence/pinned_commit.txt
          find . -name "*.jar" -path "*/target/*" -exec sha256sum {} \; > evidence/artifact_hashes.txt 2>/dev/null || true
          ls -la evidence/
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-06-sirio-build
          path: evidence/
          if-no-files-found: error
