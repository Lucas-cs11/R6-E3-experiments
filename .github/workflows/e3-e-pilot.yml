name: E3-E stratified pilot
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Stratified sample size
        default: '2000'
      shard_count:
        description: Parallel shards
        default: '8'
permissions:
  contents: read
concurrency:
  group: e3-pilot-serial
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack frozen E2 workspace
        run: |
          unzip -q baseline_readonly/inputs/R6_E2_complete_workspace.zip -d baseline_readonly
          mv baseline_readonly/R6_E2 baseline_readonly/e2
          chmod -R u+w baseline_readonly/e2
          printf '%s  %s\n' 'bb72a68af34c852213e96588b4e29ecc602b0de428d406bbd30e8300a8656715' baseline_readonly/inputs/R6_E2_complete_workspace.zip | sha256sum -c -
      - name: Run pilot shard
        run: |
          python3 -B tests/run_e3_07_pilot.py --sample '${{ inputs.sample }}' \
            --shard-index ${{ matrix.shard }} --shard-count '${{ inputs.shard_count }}'
      - name: Upload pilot shard
        uses: actions/upload-artifact@v4
        with:
          name: e3-pilot-shard-${{ matrix.shard }}
          path: runs/e3_07_pilot/
          if-no-files-found: error
