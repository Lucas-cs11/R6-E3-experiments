name: E3-09 probability units
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all probability decision units
        run: python3 -B tests/run_e3_09_units.py
      - name: Run probability tests
        run: python3 -B -m unittest tests.test_lstpn_parallel tests.test_parallel_config_runner -v
      - uses: actions/upload-artifact@v4
        with:
          name: e3-09-units-${{ github.run_id }}
          path: runs/e3_09/
          if-no-files-found: error
