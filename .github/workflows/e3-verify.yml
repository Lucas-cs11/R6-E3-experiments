name: E3 verification suite
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack frozen E2 workspace
        run: |
          unzip -q baseline_readonly/inputs/R6_E2_complete_workspace.zip -d baseline_readonly
          mv baseline_readonly/R6_E2 baseline_readonly/e2
          chmod -R u+w baseline_readonly/e2
          printf '%s  %s\n' 'bb72a68af34c852213e96588b4e29ecc602b0de428d406bbd30e8300a8656715' baseline_readonly/inputs/R6_E2_complete_workspace.zip | sha256sum -c -
      - name: Run full regression suite
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify authority manifest
        run: python3 -B tests/verify_authority_manifest.py
      - name: Verify E3 content gate on frozen evidence
        run: python3 -B tests/accept_e3.py --evidence-root baseline_readonly/e2
