name: E3 scale probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack frozen E2 workspace
        run: |
          unzip -q baseline_readonly/inputs/R6_E2_complete_workspace.zip -d baseline_readonly
          mv baseline_readonly/R6_E2 baseline_readonly/e2
          chmod -R u+w baseline_readonly/e2
          printf '%s  %s\n' 'bb72a68af34c852213e96588b4e29ecc602b0de428d406bbd30e8300a8656715' baseline_readonly/inputs/R6_E2_complete_workspace.zip | sha256sum -c -
      - name: Run merged scale probes (tractable models)
        run: python3 -B -m unittest discover -s tests -p test_scale_probe.py -v
      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e3-scale-probe
          path: runs/math_p0/scale_probe*/**.jsonl
          if-no-files-found: ignore
